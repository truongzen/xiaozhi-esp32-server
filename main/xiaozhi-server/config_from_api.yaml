# If you only want a lightweight install of xiaozhi-server using local config files, ignore this file and do not change anything in it
# If you want to fetch config from manager-api, read on:
# Copy this file into the xiaozhi-server/data directory (create data if it does not exist) and name the copy .config.yaml
# Note: if the data directory already has a .config.yaml file, delete it first
# Start manager-api and manager-web first and register an account; the first registered account is the administrator
# As the administrator, open the [Parameter Management] page, find [server.secret] and copy its value. Note that server.secret changes on every fresh deployment
# Open .config.yaml in the data directory and set manager-api.secret to the server.secret you just copied
server:
  ip: 0.0.0.0
  port: 8000
  # HTTP service port, used for the vision analysis API
  http_port: 8003
  # Vision analysis API URL
  # The vision analysis API URL sent to devices
  # With the default value below, the system auto-generates the vision analysis URL and prints it in the startup log; you can open it in a browser to verify
  # It may be inaccurate when deploying with docker or on the public internet (with SSL/domain)
  # So when deploying with docker, set vision_explain to the LAN address
  # When deploying on the public internet, set vision_explain to the public address
  vision_explain: http://你的ip或者域名:端口号/mcp/vision/explain
manager-api:
  # Your manager-api URL; a LAN IP is preferred
  # If deploying with docker, set it to http://xiaozhi-esp32-server-web:8002/xiaozhi
  url: http://127.0.0.1:8002/xiaozhi
  # Your manager-api token, i.e. the server.secret you just copied
  secret: 你的server.secret值
# Default system prompt template file
prompt_template: agent-base-prompt.txt