    model_name: glm-4v-flash  # Zhipu AI vision model
    url: https://open.bigmodel.cn/api/paas/v4/
    api_key: 你的api_key
  QwenVLVLLM:
    type: openai
    model_name: qwen3.5-flash
    url: https://dashscope.aliyuncs.com/compatible-mode/v1
    # Find your api key here: https://bailian.console.aliyun.com/?apiKey=1#/api-key
    api_key: 你的api_key
  XunfeiSparkLLM:
    # LLM API type
    type: openai
    # First create an application at the address below
    # Application page: https://console.xfyun.cn/app/myapp
    # There is a free quota, but you still need to activate the service to get an api_key
    # Each model must be activated separately and each has a different api_password; e.g. the Lite model is activated at https://console.xfyun.cn/services/cbm
    base_url: https://ark.cn-beijing.volces.com/api/v3
    model_name: lite
    api_key: 你的api_password
TTS:
  # Currently supported types are edge and doubao; you can add your own adapters
  EdgeTTS:
    # TTS API type
    type: edge
    voice: zh-CN-XiaoxiaoNeural
    output_dir: tmp/
    # language: "中文"  # Output language, e.g. 中文 (Chinese), 英语 (English), 日语 (Japanese), 韩语 (Korean); set it according to the languages supported by the selected voice; defaults to Chinese if empty
  DoubaoTTS:
    # TTS API type
    type: doubao
    # Volcengine text-to-speech service; create an application in the Volcengine console first and obtain the appid and access_token
    # Volcengine TTS must be purchased; the entry price is CNY 30 for 100 concurrent connections. The free tier only allows 2 concurrent connections and will often report TTS errors
    # After purchasing the service and a free voice, it may take about half an hour before it can be used.
    # Activate standard voices here: https://console.volcengine.com/speech/service/8
    # Activate the Wanwan Xiaohe voice here: https://console.volcengine.com/speech/service/10007; after activation set voice below to zh_female_wanwanxiaohe_moon_bigtts
    api_url: https://openspeech.bytedance.com/api/v1/tts
    voice: BV001_streaming
    output_dir: tmp/
    authorization: "Bearer;"
    appid: 你的火山引擎语音合成服务appid
    access_token: 你的火山引擎语音合成服务access_token
    cluster: volcano_tts
    speed_ratio: 1.0
    volume_ratio: 1.0
    pitch_ratio: 1.0
    # language: "中文"  # Output language, e.g. 中文 (Chinese), 英语 (English), 日语 (Japanese), 韩语 (Korean); set it according to the languages supported by the selected voice; defaults to Chinese if empty
  # Volcengine TTS, supports bidirectional streaming TTS
  HuoshanDoubleStreamTTS:
    type: huoshan_double_stream
    # Visit https://console.volcengine.com/speech/service/10007 to activate the large text-to-speech model and purchase voices
    # Get the appid and access_token at the bottom of the page
    # The resource ID is fixed to: volc.service_type.10029 (large-model text-to-speech and mixing)
    # For Gizwits, change the API address to wss://bytedance.gizwitsapi.com/api/v3/tts/bidirection
    # Gizwits does not require an appid
    ws_url: wss://openspeech.bytedance.com/api/v3/tts/bidirection
    appid: 你的火山引擎语音合成服务appid
    access_token: 你的火山引擎语音合成服务access_token
    resource_id: volc.service_type.10029
    speaker: zh_female_wanwanxiaohe_moon_bigtts
    # Enable WebSocket connection reuse, enabled by default (note: with reuse, idle connections count toward concurrency while the device is listening)
    enable_ws_reuse: True
    # Parameter documentation: https://www.volcengine.com/docs/6561/1329505
    # Audio output configuration (audio_params) - you can add any audio parameter supported by Volcengine
    audio_params:
      speech_rate: 0  # Speech rate (-50~100)
      loudness_rate: 0  # Volume (-50~100)
      # Multi-emotion voice parameters; note: currently only some voices support emotions.
      # Voice list: https://www.volcengine.com/docs/6561/1257544
      # emotion: "neutral"  # Emotion type (only some voices): neutral, happy, sad, angry, fearful, disgusted, surprised
      # emotion_scale: 4  # Emotion intensity (1~5)
    # Advanced text processing configuration (additions) - you can add any advanced parameter supported by Volcengine
    additions:
      post_process:
        pitch: 0  # Pitch (-12~12)
      # aigc_metadata: {}  # AIGC metadata configuration
      # cache_config: {}  # Cache configuration
    # Mixing configuration (mix_speaker) - mixing multiple voices (TTS 1.0 only)
    # Mixing mainly applies to Doubao TTS model 1.0 voices; set req_params.speaker to custom_mix_bigtts when using it
    # mix_speaker:
    #   speakers:
    #     - source_speaker: zh_male_bvlazysheep
    #       mix_factor: 0.3
    #     - source_speaker: BV120_streaming
    #       mix_factor: 0.3
    #     - source_speaker: zh_male_ahu_conversation_wvae_bigtts
    #       mix_factor: 0.4
    # language: "中文"  # Output language, e.g. 中文 (Chinese), 英语 (English), 日语 (Japanese), 韩语 (Korean); set it according to the languages supported by the selected voice; defaults to Chinese if empty
  # Doubao TTS model 2.0, supports bidirectional streaming TTS (based on the seed-tts-2.0 resource)
  HuoshanDoubleStreamTTSV2:
    type: huoshan_double_stream
    # Visit https://console.volcengine.com/speech/service/10035 to activate the large text-to-speech model and purchase voices
    # Get the appid and access_token at the bottom of the page
    # The resource ID is fixed to: seed-tts-2.0 (Doubao TTS model 2.0)
    # For Gizwits, change the API address to wss://bytedance.gizwitsapi.com/api/v3/tts/bidirection
    # Gizwits does not require an appid
    ws_url: wss://openspeech.bytedance.com/api/v3/tts/bidirection
    appid: 你的火山引擎语音合成服务appid
    access_token: 你的火山引擎语音合成服务access_token
    resource_id: seed-tts-2.0
    speaker: zh_female_xiaohe_uranus_bigtts
    # Enable WebSocket connection reuse, enabled by default (note: with reuse, idle connections count toward concurrency while the device is listening)
    enable_ws_reuse: True
    # Parameter documentation: https://www.volcengine.com/docs/6561/1329505
    # Audio output configuration (audio_params) - you can add any audio parameter supported by Volcengine
    audio_params:
      speech_rate: 0  # Speech rate (-50~100)
      loudness_rate: 0  # Volume (-50~100)
    # Advanced text processing configuration (additions) - you can add any advanced parameter supported by Volcengine
    additions:
      post_process:
        pitch: 0  # Pitch (-12~12)
    # language: "中文"  # Output language, e.g. 中文 (Chinese), 英语 (English), 日语 (Japanese), 韩语 (Korean); set it according to the languages supported by the selected voice; defaults to Chinese if empty
  CosyVoiceSiliconflow:
    type: siliconflow
    # SiliconFlow TTS
    # Get a token at https://cloud.siliconflow.cn/account/ak
    model: FunAudioLLM/CosyVoice2-0.5B
    voice: FunAudioLLM/CosyVoice2-0.5B:alex
    output_dir: tmp/
    access_token: 你的硅基流动API密钥
    response_format: wav
    # language: "中文"  # Output language, e.g. 中文 (Chinese), 英语 (English), 日语 (Japanese), 韩语 (Korean); set it according to the languages supported by the selected voice; defaults to Chinese if empty
  CozeCnTTS:
    type: cozecn
    # COZECN TTS
    # Get a token at https://www.coze.cn/open/oauth/pats
    voice: 7426720361733046281
    output_dir: tmp/
    access_token: 你的coze web key
    response_format: wav
    # language: "中文"  # Output language, e.g. 中文 (Chinese), 英语 (English), 日语 (Japanese), 韩语 (Korean); set it according to the languages supported by the selected voice; defaults to Chinese if empty
    # The following are optional; defaults are used if not set
    # speed: 1  # Speech rate: -0.5 to 2
    # loudness_rate: 0  # Volume: -50 to 100
  VolcesAiGatewayTTS:
    type: openai
    # Volcengine - Edge large model gateway
    # Activate the service first: open the URL below, create a gateway access key, search for and check Doubao-语音合成 (Doubao TTS), and activate it
    # If you also want to use the gateway's LLM, check Doubao-pro-32k-functioncall as well; see the LLM.VolcesAiGatewayLLM configuration
    # https://console.volcengine.com/vei/aigateway/
