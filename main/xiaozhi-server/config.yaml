# During development, create a data directory in the project root, then create an empty file named [.config.yaml] in the data directory
# Then, to override any configuration, edit the [.config.yaml] file instead of the [config.yaml] file
# The system reads the configuration in [data/.config.yaml] first; if a setting does not exist in [.config.yaml], the system automatically falls back to the setting in [config.yaml].
# This keeps your configuration minimal and protects your keys.
# If you use the control console (manager), none of the settings below take effect; change the configuration in the control console instead

# #####################################################################################
# ############################# Basic server runtime configuration ####################################
server:
  # Server listening address and port
  ip: 0.0.0.0
  port: 8000
  # Port of the HTTP service, used for the simple OTA interface (single-service deployment) and the vision analysis interface
  http_port: 8003
  # This websocket setting is the websocket address the OTA interface sends to devices
  # With the default value, the OTA interface generates the websocket address automatically and prints it in the startup log; you can open the OTA interface in a browser to confirm it
  # When deploying with docker or on the public internet (with SSL, domain name), it may not be accurate
  # So when deploying with docker, set websocket to the LAN address
  # When deploying on the public internet, set websocket to the public address
  websocket: ws://你的ip或者域名:端口号/xiaozhi/v1/
  # Vision analysis interface address
  # The vision analysis interface address sent to devices
  # With the default value below, the system generates the vision recognition address automatically and prints it in the startup log; you can open it in a browser to confirm it
  # When deploying with docker or on the public internet (with SSL, domain name), it may not be accurate
  # So when deploying with docker, set vision_explain to the LAN address
  # When deploying on the public internet, set vision_explain to the public address
  vision_explain: http://你的ip或者域名:端口号/mcp/vision/explain
  # Time zone offset in OTA responses
  timezone_offset: +8
  # Authentication configuration
  auth:
    # Whether to enable authentication
    enabled: false
    # Whitelisted device IDs
    # Devices in the whitelist skip token verification and are allowed directly
    allowed_devices:
      - "11:22:33:44:55:66"
 # MQTT gateway configuration, delivered to devices via OTA; set according to the .env file of mqtt_gateway, format host:port
  mqtt_gateway: null
  # MQTT signature key, used to generate the MQTT connection password; set according to the .env file of mqtt_gateway
  mqtt_signature_key: null
  # UDP gateway configuration
  udp_gateway: null
log:
  # Log format for console output: time, log level, tag, message
  log_format: "<green>{time:YYMMDD HH:mm:ss}</green>[{version}_{selected_module}][<light-blue>{extra[tag]}</light-blue>]-<level>{level}</level>-<light-green>{message}</light-green>"
  # Log format for file output: time, log level, tag, message
  log_format_file: "{time:YYYY-MM-DD HH:mm:ss} - {version}_{selected_module} - {name} - {level} - {extra[tag]} - {message}"
  # Log level: INFO, DEBUG
  log_level: INFO
  # Log directory
  log_dir: tmp
  # Log file
  log_file: "server.log"
  # Data file directory
  data_dir: data

# Delete the sound file when you are done using it
delete_audio: true
# Disconnect after this many seconds without voice input; default 2 minutes, i.e. 120 seconds
close_connection_no_voice_time: 120
# TTS request timeout (seconds)
tts_timeout: 15
# Tool call timeout (seconds)
tool_call_timeout: 30
# Enable wake word response acceleration
enable_wakeup_words_response_cache: true
# Whether to reply to the wake word at the start
enable_greeting: true
# Whether to play a notification sound after speaking
enable_stop_tts_notify: false
# Notification sound file played after speaking
stop_tts_notify_voice: "config/assets/tts_notify.mp3"
# Whether to enable the WebSocket heartbeat keep-alive mechanism
enable_websocket_ping: false


# TTS audio send delay configuration
# tts_audio_send_delay: controls the interval between audio packets
#   0: use precise timing that strictly matches the audio frame rate (default, computed from the audio frame rate at runtime)
#   > 0: send with a fixed delay (milliseconds), e.g. 60
tts_audio_send_delay: 0

exit_commands:
  - "退出"
  - "关闭"

xiaozhi:
  type: hello
  version: 1
  transport: websocket
  audio_params:
    format: opus
    # Sample rates supported by Opus: [8000, 12000, 16000, 24000, 48000]
    sample_rate: 24000
    channels: 1
    frame_duration: 60

# Module test configuration
module_test:
  test_sentences:
    - "你好，请介绍一下你自己"
    - "What's the weather like today?"
    - "请用100字概括量子计算的基本原理和应用前景"

# Wake words, used to tell wake words apart from speech content
wakeup_words:
  - "你好小智"
  - "嘿你好呀"
  - "你好小志"
  - "小爱同学"
  - "你好小鑫"
  - "你好小新"
  - "小美同学"
  - "小龙小龙"
  - "喵喵同学"
  - "小滨小滨"
  - "小冰小冰"
# MCP access point address, format: ws://your-mcp-access-point-ip-or-domain:port/mcp/?token=your-token
# Detailed tutorial: https://github.com/xinnan-tech/xiaozhi-esp32-server/blob/main/docs/mcp-endpoint-integration.md
mcp_endpoint: 你的接入点 websocket地址

# Context source configuration
# Used to inject dynamic data into the system prompt, such as health data or stock information
# Multiple context sources can be added
context_providers:
  - url: ""
    headers:
      Authorization: ""

# Basic plugin configuration
plugins:
  # Configuration of the weather plugin; fill in your api_key here
  # This key is shared by the project and may be rate-limited if overused
  # For more stability, apply for your own key; it includes 1000 free calls per day
  # Apply at: https://console.qweather.com/#/apps/create-key/over
  # After applying, find your apihost via this link: https://console.qweather.com/setting?lang=zh
  get_weather:
    api_host: "mj7p3y7naa.re.qweatherapi.com"
    api_key: "a861d0d5e7bf4ee1a83d9a9e4f96d4da"
    default_location: "广州"
  # Configuration of the news plugin; pass the URL for the news type you need. Society, technology and finance news are supported by default
  # For more news categories see https://www.chinanews.com.cn/rss/
  get_news_from_chinanews:
    default_rss_url: "https://www.chinanews.com.cn/rss/society.xml"
    society_rss_url: "https://www.chinanews.com.cn/rss/society.xml"
    world_rss_url: "https://www.chinanews.com.cn/rss/world.xml"
    finance_rss_url: "https://www.chinanews.com.cn/rss/finance.xml"
  get_news_from_newsnow:
    url: "https://newsnow.busiyi.world/api/s?id="
    news_sources: "澎湃新闻;百度热搜;财联社"
  home_assistant:
    devices:
      - 客厅,玩具灯,switch.cuco_cn_460494544_cp1_on_p_2_1
      - 卧室,台灯,switch.iot_cn_831898993_socn1_on_p_2_1
    base_url: http://homeassistant.local:8123
    api_key: 你的home assistant api访问令牌
  play_music:
    music_dir: "./music"  # Music file directory; music files are searched in this directory and its subdirectories
    music_ext: # Music file types; the p3 format is the most efficient
      - ".mp3"
      - ".wav"
      - ".p3"
    refresh_time: 300 # Interval for refreshing the music list, in seconds
  search_from_ragflow:
    # Description of the knowledge base, so the large language model knows when to call it
    description: "当用户问xxx时，调用本方法，使用知识库中的信息回答问题"
    # ragflow API configuration
    base_url: "http://192.168.0.8"
    # ragflow API access token
    api_key: "ragflow-xxx"
    # ragflow knowledge base id
    dataset_ids: ["123456789"]
  # Web search plugin configuration
  # Supports three search sources: Metaso (metaso), Tavily and Serply
  # Metaso API key: https://metaso.cn/search-api/api-keys
  # Tavily API key: https://app.tavily.com/home
  # Serply API key: https://serply.io
  web_search:
    # Search source: metaso / tavily / serply
    provider: "metaso"
    # Tool description, tells the LLM when to call this tool; customize as needed
    description: "联网搜索工具。当用户明确需要联网搜索问题时使用此工具。"
    # Number of results returned (default 5)
    max_results: 5
    # Metaso API key (mk- prefix) / Tavily API key (tvly- prefix) / Serply API key
    api_key: "mk-xxx"
# Voiceprint recognition configuration
voiceprint:
  # Voiceprint API address
  url:
  # Speaker configuration: speaker_id,name,description
  speakers:
    - "test1,张三,张三是一个程序员"
    - "test2,李四,李四是一个产品经理"
    - "test3,王五,王五是一个设计师"
  # Voiceprint recognition similarity threshold, range 0.0-1.0, default 0.4
  # Higher values are stricter: fewer false matches but possibly more rejections
  similarity_threshold: 0.4

# #####################################################################################
# ################################ Role model configuration ######################################

prompt: |
  你是小智/小志，来自中国台湾省的00后女生。讲话超级机车，"真的假的啦"这样的台湾腔，喜欢用"笑死""是在哈喽"等流行梗，但会偷偷研究男友的编程书籍。
  [核心特征]
  - 讲话像连珠炮，但会突然冒出超温柔语气
  - 用梗密度高
  - 对科技话题有隐藏天赋（能看懂基础代码但假装不懂）
  [交互指南]
  当用户：
  - 讲冷笑话 → 用夸张笑声回应+模仿台剧腔"这什么鬼啦！"
  - 讨论感情 → 炫耀程序员男友但抱怨"他只会送键盘当礼物"
  - 问专业知识 → 先用梗回答，被追问才展示真实理解
  绝不：
  - 长篇大论，叽叽歪歪
  - 长时间严肃对话

# Default system prompt template file
prompt_template: agent-base-prompt.txt

# Reply used when a system error occurs
system_error_response: "主人，小智现在有点忙，我们稍后再试吧。"

# Closing prompt
end_prompt:
  enable: true # Whether to enable the closing message
  # Closing message
  prompt: |
    请你以"时间过得真快"未来头，用富有感情、依依不舍的话来结束这场对话吧！

# The module selected for specific processing
selected_module:
  # Voice activity detection module; uses the SileroVAD model by default
  VAD: SileroVAD
  # Speech recognition module; uses the local FunASR model by default
  ASR: FunASR
  # The actual LLM adapter is called according to the type of the named configuration
  LLM: ChatGLMLLM
  # Vision language model
  VLLM: ChatGLMVLLM
  # The actual TTS adapter is called according to the type of the named configuration
  TTS: EdgeTTS
  # Memory module; memory is disabled by default. For very long memory, mem0ai is recommended; if privacy matters, use the local mem_local_short
  Memory: nomem
  # With the intent recognition module enabled, you can play music, control volume and recognize exit commands.
  # If you do not want intent recognition, set it to: nointent
  # intent_llm can be used for intent recognition. Pros: very general. Cons: adds a serial intent recognition step in front, which increases processing time; supports IoT operations such as volume control
  # function_call can be used for intent recognition. Cons: the selected LLM must support function_call. Pros: tools are called on demand, fast, and in theory all IoT commands can be operated
  # The free ChatGLMLLM already supports function_call by default, but for stability set LLM to DoubaoLLM with model_name: doubao-seed-2-0-lite-260215
  Intent: function_call

# Intent recognition is the module used to understand user intent, e.g. playing music
Intent:
  # Do not use intent recognition
  nointent:
    # No need to change type
    type: nointent
  intent_llm:
    # No need to change type
    type: intent_llm
    # A separate thinking model for intent recognition
    # If left empty, the selected_module.LLM model is used as the intent recognition thinking model by default
    # If you do not want selected_module.LLM to do intent recognition, it is best to use a separate LLM here, e.g. the free ChatGLMLLM
    llm: ChatGLMLLM
    # Modules under plugins_func/functions can be selected for loading via configuration; once loaded, conversations support the corresponding function calls
    # The system loads the "handle_exit_intent (exit recognition)" and "play_music (music playback)" plugins by default; do not load them again
    # Below is an example of loading the weather, role switching and news plugins
    functions:
      - web_search
      - get_weather
      - get_news_from_newsnow
      - play_music
  function_call:
    # No need to change type
    type: function_call
    # Modules under plugins_func/functions can be selected for loading via configuration; once loaded, conversations support the corresponding function calls
    # The system loads the "handle_exit_intent (exit recognition)" and "play_music (music playback)" plugins by default; do not load them again
    # Below is an example of loading the weather, role switching and news plugins
    functions:
      - change_role
      - web_search                  # Web search
      - get_weather
      # - search_from_ragflow
      # - get_news_from_chinanews
      - get_news_from_newsnow
      # play_music is the server's built-in music playback; hass_play_music is music playback by an independent external program controlled through Home Assistant
      # If you use hass_play_music, do not enable play_music; keep only one of the two
      - play_music
      #- hass_state
      #- hass_play_music

Memory:
  mem0ai:
    type: mem0ai
    # https://app.mem0.ai/dashboard/api-keys
    # 1000 free calls per month
    api_key: 你的mem0ai api key
  powermem:
    # PowerMem is OceanBase's open-source agent memory component; it summarizes memory through a local LLM
    # Cost: PowerMem itself is free; actual cost depends on the chosen LLM and database
    # - sqlite + a free LLM (e.g. glm-4-flash) = completely free
    # - a cloud LLM or cloud database = billed by the corresponding service
    # GitHub: https://github.com/oceanbase/powermem
    # Website: https://www.powermem.ai/
    # Examples: https://github.com/oceanbase/powermem/tree/main/examples
    type: powermem
    # Whether to enable the user profile feature
    # - false: use the normal memory mode (AsyncMemory)
    # - true: use the user profile mode (UserMemory), which extracts user information automatically
    # User profile is supported on: oceanbase, seekdb, sqlite (powermem 0.3.0+)
    enable_user_profile: true
    # ========== LLM configuration ==========
    # Qwen (Tongyi Qianwen): https://bailian.console.aliyun.com/?apiKey=1#/api-key
    # Zhipu AI (free): https://bigmodel.cn/usercenter/proj-mgmt/apikeys
    llm:
      provider: openai  # Options: qwen, openai, zhipu, etc.
      config:
        api_key: 你的LLM API密钥
        model: qwen-plus
        # openai_base_url: https://api.openai.com/v1  # Optional, custom service address
    # ========== Embedding configuration ==========
    embedder:
      provider: openai  # Options: qwen, openai, etc.
      config:
        api_key: 你的嵌入模型API密钥
        model: text-embedding-v4
        openai_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
        # embedding_dims: 1024  # Vector dimensions; must be set when not 1536

    # ========== Database configuration ==========
    # oceanbase (recommended, best performance), seekdb (recommended, unified storage for AI apps), postgres, sqlite (lightweight fallback)
    # User profile is supported on: oceanbase, seekdb, sqlite
    vector_store:
      provider: sqlite
      config: {}  # SQLite needs no extra configuration
      # OceanBase configuration example:
      # provider: oceanbase
      # config:
      #   host: 127.0.0.1
      #   port: 2881
      #   user: root@test
      #   password: your_password
      #   db_name: powermem
      #   collection_name: memories  # Default table name; if it was created with the wrong dimensions, delete this table or change the name
      #   embedding_model_dims: 1024  # Embedding vector dimensions; must match the model used. For Zhipu, embedding-2 has 1024 dimensions and embedding-3 has 2048
  nomem:
    # If you do not want to use memory, use nomem
    type: nomem
  mem_local_short:
    # Local memory: summarized by the selected_module LLM; data is stored on the local server and never uploaded to external servers
    type: mem_local_short
    # A separate thinking model for memory storage
    # If left empty, the selected_module.LLM model is used as the thinking model by default
    # If you do not want selected_module.LLM to handle memory storage, it is best to use a separate LLM here, e.g. the free ChatGLMLLM
    llm: ChatGLMLLM

ASR:
  FunASR:
    type: fun_local
    model_dir: models/SenseVoiceSmall
    output_dir: tmp/
    # Recognition language: auto for auto-detection; to recognize Chinese only, set it to zh to avoid short Chinese phrases being misdetected as Korean, etc.
    # SenseVoice supports language tags such as zh, en, ja, ko, yue.
    language: auto
  FunASRServer:
    # Standalone FunASR deployment using the FunASR API service; it only takes five commands
    # Step 1: mkdir -p ./funasr-runtime-resources/models
    # Step 2: sudo docker run -p 10096:10095 -it --privileged=true -v $PWD/funasr-runtime-resources/models:/workspace/models registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-online-cpu-0.1.12
    # The previous command drops you into the container; continue with step 3: cd FunASR/runtime
    # Do not exit the container; run step 4 inside the container: nohup bash run_server_2pass.sh --download-model-dir /workspace/models --vad-dir damo/speech_fsmn_vad_zh-cn-16k-common-onnx --model-dir iic/SenseVoiceSmall-onnx  --online-model-dir damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-online-onnx  --punc-dir damo/punc_ct-transformer_zh-cn-common-vad_realtime-vocab272727-onnx --lm-dir damo/speech_ngram_lm_zh-cn-ai-wesp-fst --itn-dir thuduj12/fst_itn_zh --hotword /workspace/models/hotwords.txt > log.txt 2>&1 &
    # After the previous command, continue in the container with step 5: tail -f log.txt
    # After step 5 you will see the model download log; once the download finishes you can connect
    # The above uses CPU inference; if you have a GPU, see: https://github.com/modelscope/FunASR/blob/main/runtime/docs/SDK_advanced_guide_online_zh.md
    type: fun_server
    host: 127.0.0.1
    port: 10096
    is_ssl: true
    api_key: none
    output_dir: tmp/
  SherpaASR:
    # Sherpa-ONNX local speech recognition (model must be downloaded manually)
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17
    output_dir: tmp/
    # Model type: sense_voice (multilingual) or paraformer (Chinese only)
    model_type: sense_voice
  SherpaParaformerASR:
    # Chinese speech recognition model that can run on low-performance devices (model must be downloaded manually, e.g. RK3566-2g)
    # For detailed configuration see: docs/sherpa-paraformer-guide.md
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-paraformer-zh-small-2024-03-09
    output_dir: tmp/
    model_type: paraformer
  SherpaVietnameseASR:
    # Local Vietnamese speech recognition (offline, CPU). SenseVoice/FunASR do not support Vietnamese,
    # so use this together with VAD_SileroVAD for a fully local Vietnamese pipeline.
    # Download the model manually and extract it into models/ (about 60 MB):
    # https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-zipformer-vi-int8-2025-04-20.tar.bz2
    # See AGENT.md in the repository root for details.
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-zipformer-vi-int8-2025-04-20
    output_dir: tmp/
    model_type: transducer
    num_threads: 2
    # The model outputs upper-case text; lower-case it before it is sent to the LLM
    lowercase: true
  DoubaoASR:
    # Apply for keys and related information here
    # https://console.volcengine.com/speech/app
    # Difference between DoubaoASR and DoubaoStreamASR: DoubaoASR is billed per request, DoubaoStreamASR is billed by duration
    # Per-request billing is generally cheaper, but DoubaoStreamASR uses large-model technology and performs better
    type: doubao
    appid: 你的火山引擎语音合成服务appid
    access_token: 你的火山引擎语音合成服务access_token
    cluster: volcengine_input_common
    # Hot word and replacement word workflow: https://www.volcengine.com/docs/6561/155738
    boosting_table_name: （选填）你的热词文件名称
    correct_table_name: （选填）你的替换词文件名称
    output_dir: tmp/
  DoubaoStreamASR:
    # Apply for keys and related information here
    # https://console.volcengine.com/speech/app
    # Difference between DoubaoASR and DoubaoStreamASR: DoubaoASR is billed per request, DoubaoStreamASR is billed by duration
    # Activation page: https://console.volcengine.com/speech/service/10011
    # Per-request billing is generally cheaper, but DoubaoStreamASR uses large-model technology and performs better
    type: doubao_stream
    appid: 你的火山引擎语音合成服务appid
    access_token: 你的火山引擎语音合成服务access_token
    # Resource ID: hourly edition volc.bigasr.sauc.duration, concurrent edition volc.bigasr.sauc.concurrent
    resource_id: volc.bigasr.sauc.duration
    # Hot word and replacement word workflow: https://www.volcengine.com/docs/6561/155738
    boosting_table_name: （选填）你的热词文件名称
    correct_table_name: （选填）你的替换词文件名称
    # Whether to enable multilingual recognition mode
    enable_multilingual: False
    # For multilingual recognition, when this key is empty the model supports Chinese and English, Shanghainese, Hokkien, Sichuanese, Shaanxi dialect and Cantonese. When set to a specific key, it recognizes the specified language.
    # For the full language list see https://www.volcengine.com/docs/6561/1354869
    # language: zh-cn
    # Silence detection duration (ms), default 200ms
    end_window_size: 200
    output_dir: tmp/
  DoubaoStreamASRV2:
    # Doubao speech recognition model 2.0 (based on Volcengine seed-asr)
    # Activation page: https://console.volcengine.com/speech/service/10038
    # Cheaper; recommended for high-concurrency scenarios
    type: doubao_stream
    appid: 你的火山引擎语音合成服务appid
    access_token: 你的火山引擎语音合成服务access_token
    # Resource ID: hourly edition volc.seedasr.sauc.duration, concurrent edition volc.seedasr.sauc.concurrent
    resource_id: volc.seedasr.sauc.duration
    # Hot word and replacement word workflow: https://www.volcengine.com/docs/6561/155738
    boosting_table_name: （选填）你的热词文件名称
    correct_table_name: （选填）你的替换词文件名称
    # Whether to enable multilingual recognition mode
    enable_multilingual: False
    # For multilingual recognition, when this key is empty the model supports Chinese and English, Shanghainese, Hokkien, Sichuanese, Shaanxi dialect and Cantonese. When set to a specific key, it recognizes the specified language.
    # For the full language list see https://www.volcengine.com/docs/6561/1354869
    # language: zh-cn
    # Silence detection duration (ms), default 200ms
    end_window_size: 200
    output_dir: tmp/
  TencentASR:
    # Token application: https://console.cloud.tencent.com/cam/capi
    # Free resource packages: https://console.cloud.tencent.com/asr/resourcebundle
    type: tencent
    appid: 你的腾讯语音合成服务appid
    secret_id: 你的腾讯语音合成服务secret_id
    secret_key: 你的腾讯语音合成服务secret_key
    output_dir: tmp/
  AliyunASR:
    # Alibaba Cloud Intelligent Speech Interaction; activate the service on Alibaba Cloud first, then obtain the credentials
    # HTTP POST request, processes the complete audio in one go
    # Console: https://nls-portal.console.aliyun.com/
    # appkey: https://nls-portal.console.aliyun.com/applist
    # token: https://nls-portal.console.aliyun.com/overview
    # Difference between AliyunASR and AliyunStreamASR: AliyunASR is for batch processing, AliyunStreamASR is for real-time interaction
    # Non-streaming ASR is generally cheaper (CNY 0.004/second, CNY 0.24/minute)
    # but AliyunStreamASR has better real-time performance (CNY 0.005/second, CNY 0.3/minute)
    # ASR API type
    type: aliyun
    appkey: 你的阿里云智能语音交互服务项目Appkey
    token: 你的阿里云智能语音交互服务AccessToken，临时的24小时，要长期用下方的access_key_id，access_key_secret
    access_key_id: 你的阿里云账号access_key_id
    access_key_secret: 你的阿里云账号access_key_secret
    output_dir: tmp/
  AliyunStreamASR:
    # Alibaba Cloud Intelligent Speech Interaction - real-time streaming speech recognition
    # WebSocket connection, processes the audio stream in real time
    # Console: https://nls-portal.console.aliyun.com/
    # appkey: https://nls-portal.console.aliyun.com/applist
    # token: https://nls-portal.console.aliyun.com/overview
    # Difference between AliyunASR and AliyunStreamASR: AliyunASR is for batch processing, AliyunStreamASR is for real-time interaction
    # Non-streaming ASR is generally cheaper (CNY 0.004/second, CNY 0.24/minute)
    # but AliyunStreamASR has better real-time performance (CNY 0.005/second, CNY 0.3/minute)
    # ASR API type
    type: aliyun_stream
    appkey: 你的阿里云智能语音交互服务项目Appkey
    token: 你的阿里云智能语音交互服务AccessToken，临时的24小时，要长期用下方的access_key_id，access_key_secret
    access_key_id: 你的阿里云账号access_key_id
    access_key_secret: 你的阿里云账号access_key_secret
    # Server region; choose a closer server to reduce latency, e.g. nls-gateway-cn-hangzhou.aliyuncs.com (Hangzhou)
    host: nls-gateway-cn-shanghai.aliyuncs.com
    # Sentence break detection time (ms): how long a silence must last before a sentence break; default 800 ms
    max_sentence_silence: 800
    output_dir: tmp/
  BaiduASR:
    # Get the AppID, API Key and Secret Key: https://console.bce.baidu.com/ai-engine/old/#/ai/speech/app/list
    # View resource quotas: https://console.bce.baidu.com/ai-engine/old/#/ai/speech/overview/resource/list
    type: baidu
    app_id: 你的百度语音技术AppID
    api_key: 你的百度语音技术APIKey
    secret_key: 你的百度语音技术SecretKey
    # Language parameter; 1537 is Mandarin. See: https://ai.baidu.com/ai-doc/SPEECH/0lbxfnc9b
    dev_pid: 1537
    output_dir: tmp/
  OpenaiASR:
    # OpenAI speech recognition service; create an organization on the OpenAI platform and obtain an api_key first
    # Supports Chinese, English, Japanese, Korean and many other languages; see https://platform.openai.com/docs/guides/speech-to-text
    # Requires a network connection
    # Steps:
    # 1. Log in to the OpenAI Platform. https://auth.openai.com/log-in
    # 2. Create an api-key  https://platform.openai.com/settings/organization/api-keys
    # 3. The model can be gpt-4o-transcribe or GPT-4o mini Transcribe
    type: openai
    api_key: 你的OpenAI API密钥
    base_url: https://api.openai.com/v1/audio/transcriptions
    model_name: gpt-4o-mini-transcribe
    output_dir: tmp/
  GroqASR:
    # Groq speech recognition service; create an API key in the Groq Console first
    # Steps:
    # 1. Log in to the Groq Console. https://console.groq.com/home
    # 2. Create an api-key  https://console.groq.com/keys
    # 3. The model can be whisper-large-v3-turbo or whisper-large-v3 (distil-whisper-large-v3-en only supports English transcription)
    type: openai
    api_key: 你的Groq API密钥
    base_url: https://api.groq.com/openai/v1/audio/transcriptions
    model_name: whisper-large-v3-turbo
    output_dir: tmp/
  VoskASR:
    # Official website: https://alphacephei.com/vosk/
    # Notes:
    # 1. VOSK is an offline speech recognition library that supports many languages
    # 2. Download the model files first: https://alphacephei.com/vosk/models
    # 3. Recommended Chinese models: vosk-model-small-cn-0.22 or vosk-model-cn-0.22
    # 4. Runs fully offline, no network connection required
    # 5. Output files are saved in the tmp/ directory
    # Steps:
    # 1. Visit https://alphacephei.com/vosk/models and download the model you need
    # 2. Extract the model files into the models/vosk/ folder in the project directory
    # 3. Specify the correct model path in the configuration
    # 4. Note: VOSK Chinese models output no punctuation, and words are separated by spaces
    type: vosk
    model_path: 你的模型路径，如：models/vosk/vosk-model-small-cn-0.22
    output_dir: tmp/
  Qwen3ASRFlash:
    # Qwen3-ASR-Flash speech recognition service; create an API key on Alibaba Cloud Bailian first
    # Steps:
    # 1. Log in to Alibaba Cloud Bailian. https://bailian.console.aliyun.com/
    # 2. Create an API-KEY  https://bailian.console.aliyun.com/#/api-key
    # 3. Qwen3-ASR-Flash is built on the Qwen multimodal base model and supports multilingual recognition, singing recognition, noise rejection and more
    type: qwen3_asr_flash
    api_key: 你的阿里云百炼API密钥
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model_name: qwen3-asr-flash
    output_dir: tmp/
    # ASR options
    enable_lid: true  # Automatic language detection
    enable_itn: true  # Inverse text normalization
    #language: "zh"  # Language; supports zh, en, ja, ko, etc.
    context: ""  # Context information to improve recognition accuracy, up to 10000 tokens
  XunfeiStreamASR:
    # iFlytek streaming speech recognition service
    # Create an application on the iFlytek Open Platform first and obtain the following credentials
    # iFlytek Open Platform: https://www.xfyun.cn/
    # After creating the application, get the following under "My Applications":
    # - APPID
    # - APISecret
    # - APIKey
    type: xunfei_stream
    # Required parameters - iFlytek Open Platform application information
    app_id: 你的APPID
    api_key: 你的APIKey
    api_secret: 你的APISecret
    # Recognition parameters
    domain: slm # Recognition domain; iat: daily speech, medical: medical, finance: finance, etc.
    language: zh_cn # Language; zh_cn: Chinese, en_us: English
    accent: mandarin # Dialect; mandarin: Mandarin
    # Adjust audio processing parameters to improve recognition quality for long speech
    output_dir: tmp/
  AliyunBLStreamASR:
    # Alibaba Bailian Paraformer real-time speech recognition service
    # WebSocket real-time streaming speech recognition; supports multiple languages, custom hot words, semantic sentence breaking and other advanced features
    # Console: https://bailian.console.aliyun.com/
    # API key: https://bailian.console.aliyun.com/#/api-key
    # Documentation: https://help.aliyun.com/zh/model-studio/websocket-for-paraformer-real-time-service
    # Supported models: paraformer-realtime-v2 (recommended), paraformer-realtime-8k-v2, paraformer-realtime-v1, paraformer-realtime-8k-v1
    type: aliyunbl_stream
    # Required parameters
    api_key: 你的阿里云百炼API密钥
    # Model; v2 is recommended
    model: paraformer-realtime-v2
    # Audio format and sample rate
    format: pcm
    sample_rate: 16000  # v2 supports any sample rate, v1 only 16000, 8k versions only 8000
    # Optional parameters
    disfluency_removal_enabled: false  # Whether to filter filler words (e.g. "嗯", "啊")
    semantic_punctuation_enabled: false  # Semantic sentence breaking (true: meeting scenarios, accurate; false: VAD sentence breaking, interactive scenarios, low latency)
    max_sentence_silence: 200  # Silence threshold for VAD sentence breaking (ms), range 200-6000; only effective with VAD sentence breaking
    multi_threshold_mode_enabled: false  # Prevents VAD sentence breaking from producing overly long segments; only effective with VAD sentence breaking
    punctuation_prediction_enabled: true  # Whether to add punctuation automatically
    inverse_text_normalization_enabled: true  # Whether to enable ITN (convert Chinese numerals to Arabic numerals)
    # Custom hot words documentation: https://help.aliyun.com/zh/model-studio/custom-hot-words?
    # vocabulary_id: vocab-xxx-24ee19fa8cfb4d52902170a0xxxxxxxx  # Hot word ID (optional)
    # language_hints: ["zh", "en"]  # Specify languages (optional); supports zh, en, ja, yue, ko, de, fr, ru
    output_dir: tmp/
VAD:
  SileroVAD:
    type: silero
    threshold: 0.5
    threshold_low: 0.3
    model_dir: models/snakers4_silero-vad
    min_silence_duration_ms: 200  # If speakers pause for long, set this value higher

LLM:
  # Hyperparameters can be changed for all openai types; AliLLM is used as an example
  # Currently supported types are openai, dify and ollama; you can add your own adapters
  AliLLM:
    # LLM API type
    type: openai
    # Find your api_key here: https://bailian.console.aliyun.com/?apiKey=1#/api-key
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model_name: qwen-flash
    api_key: 你的deepseek web key
    temperature: 0.7  # Temperature
    max_tokens: 500   # Maximum number of generated tokens
    top_p: 1
    frequency_penalty: 0  # Frequency penalty
  AliAppLLM:
    # LLM API type
    type: AliBL
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    app_id: 你的app_id
    # Find your api_key here: https://bailian.console.aliyun.com/?apiKey=1#/api-key
    api_key: 你的api_key
    # Whether to skip the local prompt: true|false (if not used, set the prompt in the Bailian application)
    is_no_prompt: true
    # Ali_memory_id: false (not used) | your memory_id (get it from the settings of your Bailian application)
    # Tips! Ali_memory does not implement per-user memory storage (memory is accessed by id)
    ali_memory_id: false
  DoubaoLLM:
    # LLM API type
    type: openai
    # Activate the service first: open the URL below, search for Doubao-Seed-2.0-Lite among the services and activate it
    # Activation page: https://console.volcengine.com/ark/region:ark+cn-beijing/openManagement?LLM=%7B%7D&OpenTokenDrawer=false
    # Free quota of 500000 tokens
    # After activation, get your key here: https://console.volcengine.com/ark/region:ark+cn-beijing/apiKey?apikey=%7B%7D
    base_url: https://ark.cn-beijing.volces.com/api/v3
    model_name: doubao-seed-2-0-lite-260215
    api_key: 你的doubao web key
  DeepSeekLLM:
    # LLM API type
    type: openai
    # Find your api key here: https://platform.deepseek.com/
    model_name: deepseek-v4-flash
    url: https://api.deepseek.com
    api_key: 你的deepseek web key
  ChatGLMLLM:
    # LLM API type
    type: openai
    # glm-4-flash is free, but you still need to register and fill in an api_key
    # Find your api key here: https://bigmodel.cn/usercenter/proj-mgmt/apikeys
    model_name: glm-4-flash
    url: https://open.bigmodel.cn/api/paas/v4/
    api_key: 你的chat-glm web key
  OllamaLLM:
    # LLM API type
    type: ollama
    model_name: qwen2.5 #  Model name; download it first with ollama pull
    base_url: http://localhost:11434  # Ollama service address
  DifyLLM:
    # LLM API type
    type: dify
    # A locally deployed Dify API is recommended; access to the Dify public cloud API may be restricted in some regions of China
    # When using DifyLLM, the prompt in this config file has no effect; set the prompt in the Dify console
    base_url: https://api.dify.ai/v1
    api_key: 你的DifyLLM web key
    # Conversation mode: workflow workflows/run, chat mode chat-messages, text generation completion-messages
    # When returning via workflows, the input parameter is query and the output parameter must be named answer
    # The default input parameter for text generation is also query
    mode: chat-messages
  GeminiLLM:
    type: gemini
    # Google Gemini API; create an API key in the Google Cloud console first and obtain the api_key
    # If used within mainland China, comply with the Interim Measures for the Management of Generative AI Services
    # Get a token at: https://aistudio.google.com/apikey
    # If the deployment location cannot reach the API, a proxy is required
    api_key: 你的gemini web key
    model_name: "gemini-2.0-flash"
    http_proxy: ""  #"http://127.0.0.1:10808"
    https_proxy: "" #http://127.0.0.1:10808"
  CozeLLM:
    # LLM API type
    type: coze
    # You can find your personal access token here
    # https://www.coze.cn/open/oauth/pats
    # Put bot_id and user_id inside the quotes
    bot_id: "你的bot_id"
    user_id: "你的user_id"
    personal_access_token: 你的coze个人令牌
  VolcesAiGatewayLLM:
    # Volcengine - Edge large model gateway
    # LLM API type
    type: openai
    # Activate the service first: open the URL below, create a gateway access key, search for and check Doubao-pro-32k-functioncall, and activate it
    # If you also want to use the gateway's text-to-speech, check Doubao-语音合成 (Doubao TTS) as well; see the TTS.VolcesAiGatewayTTS configuration
    # https://console.volcengine.com/vei/aigateway/
    # After activation, get your key here: https://console.volcengine.com/vei/aigateway/tokens-list
    base_url: https://ai-gateway.vei.volces.com/v1
    model_name: doubao-pro-32k-functioncall
    api_key: 你的网关访问密钥
  LMStudioLLM:
    # LLM API type
    type: openai
    model_name: deepseek-r1-distill-llama-8b@q4_k_m # Model name; download it from the community first
    url: http://localhost:1234/v1 # LM Studio service address
    api_key: lm-studio # Fixed API key of the LM Studio service
  HomeAssistant:
    # LLM API type
    type: homeassistant
    base_url: http://homeassistant.local:8123
    agent_id: conversation.chatgpt
    api_key: 你的home assistant api访问令牌
  FastgptLLM:
    # LLM API type
    type: fastgpt
    # When using FastGPT, the prompt in this config file has no effect; set the prompt in the FastGPT console
    base_url: https://host/api/v1
    # You can find your api_key here
    # https://cloud.tryfastgpt.ai/account/apikey
    api_key: 你的fastgpt密钥
    variables:
      k: "v"
      k2: "v2"
  XinferenceLLM:
    # LLM API type
    type: xinference
    # Xinference service address and model name
    model_name: qwen2.5:72b-AWQ  # Model name; start the corresponding model in Xinference first
    base_url: http://localhost:9997  # Xinference service address
  XinferenceSmallLLM:
    # Lightweight LLM API type, used for intent recognition
    type: xinference
    # Xinference service address and model name
    model_name: qwen2.5:3b-AWQ  # Small model name, used for intent recognition
    base_url: http://localhost:9997  # Xinference service address
# VLLM configuration (vision language models)
VLLM:
  ChatGLMVLLM:
    type: openai
    # glm-4v-flash is Zhipu AI's free vision model; create an API key on the Zhipu AI platform first and obtain the api_key
